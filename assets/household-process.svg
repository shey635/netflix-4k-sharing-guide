<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="300" viewBox="0 0 1050 300" role="img" aria-labelledby="title desc"><title id="title">Netflix同户提示处理流程</title><desc id="desc">设备打开Netflix后按正常状态或同户提示处理</desc><rect width="1050" height="300" rx="24" fill="#f6f7fb"/><text x="525" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172033">Netflix 同户提示怎么处理</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#718096"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#172033"><rect x="45" y="105" width="180" height="85" rx="16" fill="#ece8ff"/><text x="135" y="155">设备打开Netflix</text><rect x="285" y="105" width="200" height="85" rx="16" fill="#dfe6ff"/><text x="385" y="140">是否识别为</text><text x="385" y="165">当前同户设备</text><rect x="565" y="75" width="190" height="75" rx="16" fill="#d5eee6"/><text x="660" y="120">正常观看</text><rect x="565" y="180" width="190" height="75" rx="16" fill="#ffe5df"/><text x="660" y="225">出现同户提示</text><rect x="815" y="180" width="190" height="75" rx="16" fill="#fff0cc"/><text x="910" y="210">按官方或订单</text><text x="910" y="235">售后入口处理</text></g><g stroke="#718096" stroke-width="3" marker-end="url(#a)"><line x1="230" y1="147" x2="278" y2="147"/><line x1="490" y1="132" x2="558" y2="112"/><line x1="490" y1="165" x2="558" y2="208"/><line x1="760" y1="217" x2="808" y2="217"/></g><text x="520" y="95" font-family="Arial,sans-serif" font-size="15" fill="#4b5563">是</text><text x="520" y="205" font-family="Arial,sans-serif" font-size="15" fill="#4b5563">否</text></svg>
