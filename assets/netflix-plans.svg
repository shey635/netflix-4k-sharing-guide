<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Netflix购买方式区别</title><desc id="desc">自己订阅、共享车位与官方额外成员不是同一种形式</desc><rect width="1000" height="420" rx="24" fill="#f6f7fb"/><text x="500" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">三种方式不是一回事</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="95" width="270" height="245" rx="22" fill="#fff" stroke="#7b4ec7" stroke-width="3"/><text x="190" y="145" font-size="22" font-weight="700" fill="#172033">自己订阅</text><text x="190" y="195" font-size="17" fill="#4b5563">账号和付款自己管理</text><text x="190" y="230" font-size="17" fill="#4b5563">最省心</text><rect x="365" y="95" width="270" height="245" rx="22" fill="#fff" stroke="#4c6cb5" stroke-width="3"/><text x="500" y="145" font-size="22" font-weight="700" fill="#172033">共享车位</text><text x="500" y="195" font-size="17" fill="#4b5563">共用主账号</text><text x="500" y="230" font-size="17" fill="#4b5563">分配独立Profile</text><rect x="675" y="95" width="270" height="245" rx="22" fill="#fff" stroke="#327b80" stroke-width="3"/><text x="810" y="145" font-size="22" font-weight="700" fill="#172033">官方额外成员</text><text x="810" y="195" font-size="17" fill="#4b5563">自己的账号和密码</text><text x="810" y="230" font-size="17" fill="#4b5563">1个Profile / 1台同时看</text></g><text x="500" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#4b5563">购买前先确认账号归属、设备限制和同户规则</text></svg>
